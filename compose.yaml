services:
  web:
    build: .
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8080}:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
